name: Build Android & Deploy to Telegram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Determine Version Code & Name
        run: |
          BUILD_NUMBER=$(( 100 + GITHUB_RUN_NUMBER ))
          VERSION="1.0.0"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure Android Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
            cat <<EOF > key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=app/upload-keystore.jks
          EOF
          else
            echo "::warning::KEYSTORE_BASE64 not set, will produce debug APK"
          fi

      - name: Build Android APK
        run: |
          if [ -f key.properties ]; then
            ./gradlew assembleRelease "-PversionCode=$BUILD_NUMBER" "-PversionName=$VERSION"
          else
            ./gradlew assembleDebug "-PversionCode=$BUILD_NUMBER" "-PversionName=$VERSION"
          fi

      - name: Locate APK & Get Metadata
        id: apk-info
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK as Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-recovery-apk
          path: ${{ steps.apk-info.outputs.apk_path }}
          retention-days: 14

      - name: Send APK to Telegram
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          APK_PATH="${{ steps.apk-info.outputs.apk_path }}"
          APP_NAME="Assets Recovery"
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          
          CAPTION=$(cat <<EOF
          🛡 $APP_NAME
          🏷 Version: $VERSION
          🔢 Build: $BUILD_NUMBER
          🌿 Branch: $BRANCH
          🔗 Commit: $COMMIT_SHA
          ✅ Status: Built Successfully
          ⏰ Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHANNEL_ID}" \
            -F document=@"$APK_PATH" \
            -F caption="$CAPTION"

      - name: Send Success Summary to Telegram
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          COMMIT_SHA="${GITHUB_SHA::7}"
          MESSAGE=$(cat <<EOF
          🚀 Assets Recovery Android build completed successfully!
          🏷 Version: $VERSION ($BUILD_NUMBER)
          🔗 Commit: $COMMIT_SHA
          📦 APK delivered to Telegram channel
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHANNEL_ID}" \
            -d text="$MESSAGE"

      - name: Send Failure Notification to Telegram
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          COMMIT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          
          MESSAGE=$(cat <<EOF
          ❌ Assets Recovery build FAILED!
          Branch: $BRANCH
          Commit: $COMMIT_SHA
          Run ID: $GITHUB_RUN_ID
          Check GitHub Actions for details.
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHANNEL_ID}" \
            -d text="$MESSAGE"
